<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rápido & Deli | Comida Rápida y Helados en Quibdó</title>
    <meta name="description" content="Disfrute de la mejor comida rápida artesanal y helados gourmet en Quibdó. Explore nuestro menú interactivo, elija sus platos y ordene por WhatsApp." />
    <style>
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0a0a09;
        color: #f5f5f0;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .loader-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
        border-radius: 50%;
        animation: pulse 1.5s infinite ease-in-out;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(212, 175, 55, 0.1);
        border-left-color: #d4af37;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <img class="loader-logo" src="/logo.png" alt="Rápido & Deli Logo" />
        <div class="spinner"></div>
        <p style="font-size: 1.25rem; font-weight: 600; letter-spacing: 0.5px; margin: 0; font-family: 'Playfair Display', Georgia, serif;">Rápido & Deli</p>
        <p style="font-size: 1.05rem; font-weight: 500; color: #d4af37; margin: 8px 0 0 0;">Preparando el menú...</p>
        <p style="font-size: 0.85rem; color: #a0a095; margin-top: 12px; max-width: 300px; line-height: 1.4;">Por favor espera un momento mientras conectamos con la cocina.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
